# GlueOps fork: release-please opens the release PR; merging it creates the tag and a DRAFT release. goreleaser then
# signs and uploads the assets to that draft and publishes it, so a release is never visible without its assets.
# See FORK.md. This file is owned by the fork; upstream changes to it are reviewed per sync, never merged blindly.
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # An App token (not GITHUB_TOKEN) so the release PR runs PR checks; the App also bypasses the v* tag ruleset.
      - name: Generate App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create / update release PR, or create the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Separate job so the signing key only enters runs that actually release, and a failure can be retried with
  # "Re-run failed jobs" while the release is still a draft (job 1's outputs are kept). See FORK.md.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # These checks run before the signing key is loaded.
      - name: Check the tag is the released commit
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          got=$(git rev-parse "$TAG^{commit}")
          if [ "$got" != "$SHA" ]; then
            echo "::error::$TAG points at $got, but release-please released $SHA"
            exit 1
          fi

      - name: Check the release is still release-please's draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | select(.tag_name == env.TAG or .name == env.TAG) | "\(.id) \(.draft)"')
          if [ "$releases" != "$RELEASE_ID true" ]; then
            echo "::error::Expected exactly one release for $TAG, the draft $RELEASE_ID; found: ${releases:-none}"
            echo "::error::If it is already published, don't re-run this job (see FORK.md, Emergency release)."
            exit 1
          fi

      # goreleaser uses upstream's .goreleaser.yaml, plus: upload to release-please's draft (not a new release), and
      # replace assets a failed earlier attempt left on it. The checks stop an upstream change from breaking that.
      - name: Prepare the goreleaser config
        run: |
          yq '.release.use_existing_draft = true | .release.replace_existing_artifacts = true' .goreleaser.yaml \
            > "$RUNNER_TEMP/goreleaser.yaml"
          yq -e '.release.use_existing_draft == true and (.release.draft // false) == false
            and (.release.replace_existing_draft // false) == false
            and ((.release.name_template // "{{.Tag}}") == "{{.Tag}}")' "$RUNNER_TEMP/goreleaser.yaml" > /dev/null

      # go.mod pins x.y.0; build with the newest x.y patch (as upstream's releases do), not the bare minimum.
      - name: Read Go version
        id: go
        run: echo "version=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]; exit}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache: false

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.1
          # An explicit config, so a .goreleaser.yml or .config/goreleaser.yaml added upstream can't take precedence.
          # ${{ }} rather than $RUNNER_TEMP: the action runs goreleaser without a shell.
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ./dist/*.zip
